name: CI

on:
  push:
    branches:
      - main
      - bootstrap*
      - chore/*
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main
      - bootstrap*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-check:
    name: Core & CLI (Java 21 / Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test Core Engine
        working-directory: core
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport jar

      - name: Build & Test CLI
        working-directory: tools/cli
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar

  editor-check:
    name: Editor Desktop (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/editor/package-lock.json

      - name: Install dependencies
        working-directory: tools/editor
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: tools/editor
        run: npm test

      - name: Build Editor
        working-directory: tools/editor
        run: npm run build

  docs-check:
    name: Documentation (VitePress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress docs
        working-directory: docs
        run: npm run build
