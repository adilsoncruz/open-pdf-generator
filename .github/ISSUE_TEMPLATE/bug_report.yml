name: "🐛 Bug Report"
description: File a bug report to help us improve Open PDF Generator
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the project is affected?
      options:
        - "Core Engine (Kotlin/Java)"
        - "CLI (tools/cli)"
        - "Editor Desktop (tools/editor)"
        - "Documentation (docs)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / Template JSON
      description: Provide steps to reproduce or minimal template JSON causing the error.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Java version (`java -version`), Node version (`node -v`), etc.
      value: |
        - OS: [e.g. macOS 14 / Ubuntu 22.04 / Windows 11]
        - Java Version: [e.g. 21]
        - Node Version (if Editor): [e.g. 20]
        - Open PDF Generator Version: [e.g. 1.0.0]
    validations:
      required: false
