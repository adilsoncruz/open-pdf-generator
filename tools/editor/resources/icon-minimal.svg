<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#mainGrad)"/>
  
  <!-- Subtle top reflection -->
  <rect x="24" y="24" width="464" height="232" rx="104" ry="104" fill="white" opacity="0.08"/>
  
  <!-- Minimalist document icon -->
  <g fill="white">
    <!-- Base document -->
    <path d="M 168 96 
             L 296 96 
             L 344 144 
             L 344 416 
             L 168 416 
             Z" 
          fill="white" 
          opacity="0.95"/>
    
    <!-- Folded corner -->
    <path d="M 296 96 L 296 144 L 344 144 Z" fill="white" opacity="0.7"/>
    
    <!-- Content lines -->
    <rect x="196" y="176" width="80" height="10" rx="5" fill="#6366F1"/>
    <rect x="196" y="200" width="120" height="10" rx="5" fill="#A5B4FC"/>
    <rect x="196" y="224" width="100" height="10" rx="5" fill="#A5B4FC"/>
    
    <!-- Table/data area -->
    <rect x="196" y="256" width="120" height="70" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
    
    <!-- Mini grid -->
    <rect x="206" y="268" width="40" height="16" rx="4" fill="#818CF8"/>
    <rect x="254" y="268" width="52" height="16" rx="4" fill="#A5B4FC"/>
    <rect x="206" y="292" width="52" height="16" rx="4" fill="#C7D2FE"/>
    <rect x="266" y="292" width="40" height="16" rx="4" fill="#818CF8"/>
    
    <!-- Bottom text -->
    <rect x="196" y="350" width="60" height="10" rx="5" fill="#6366F1"/>
    <rect x="268" y="350" width="48" height="10" rx="5" fill="#4F46E5"/>
  </g>
</svg>
