<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="gridAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4F46E5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg2)"/>
  <!-- Subtle Golden Ratio Grid Lines -->
  <g stroke="#6366F1" stroke-opacity="0.16" stroke-width="2">
    <line x1="148" y1="40" x2="148" y2="472"/>
    <line x1="232" y1="40" x2="232" y2="472"/>
    <line x1="364" y1="40" x2="364" y2="472"/>
    <line x1="40" y1="120" x2="472" y2="120"/>
    <line x1="40" y1="296" x2="472" y2="296"/>
    <line x1="40" y1="392" x2="472" y2="392"/>
  </g>
  <rect x="26" y="26" width="460" height="460" rx="110" stroke="#818CF8" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Geometric P Monogram + Layout Blocks -->
  <g filter="url(#glow2)">
    <!-- P Loop Ribbon -->
    <path d="M 148 120 H 288 C 336 120 372 156 372 208 C 372 260 336 296 288 296 H 212 V 232 H 280 C 296 232 308 222 308 208 C 308 194 296 184 280 184 H 148 Z" fill="url(#loopGrad)"/>

    <!-- Vertical Stem Pillar -->
    <rect x="148" y="120" width="64" height="272" rx="32" fill="url(#stemGrad)"/>

    <!-- Floating Studio Template Nodes (Bottom Right Counter-Balance) -->
    <rect x="244" y="324" width="68" height="68" rx="18" fill="url(#gridAccent)"/>
    <rect x="328" y="324" width="36" height="30" rx="10" fill="#38BDF8" fill-opacity="0.9"/>
    <rect x="328" y="362" width="36" height="30" rx="10" fill="#818CF8" fill-opacity="0.9"/>
  </g>

  <!-- Corner Precision Crosshairs -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M 140 120 H 156 M 148 112 V 128"/>
    <path d="M 364 208 H 380 M 372 200 V 216"/>
    <path d="M 236 324 H 252 M 244 316 V 332"/>
  </g>
</svg>
