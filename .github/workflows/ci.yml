name: CI

on:
  push:
    branches:
      - main
      - develop
      - bootstrap*
      - chore/*
      - feat/*
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main
      - develop
      - bootstrap*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-check:
    name: Core & CLI (Java 21 / Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, Test & Verify Coverage (Core Engine)
        working-directory: core
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification jar

      - name: Upload Core Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-coverage-reports
          path: |
            core/build/reports/tests/test/
            core/build/reports/jacoco/test/html/
            core/build/pdf-snapshots/
          if-no-files-found: ignore

      - name: Build, Test & Coverage CLI
        working-directory: tools/cli
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport shadowJar

      - name: Upload CLI Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-coverage-reports
          path: |
            tools/cli/build/reports/tests/test/
            tools/cli/build/reports/jacoco/test/html/
          if-no-files-found: ignore

  editor-check:
    name: Editor Desktop (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/editor/package-lock.json

      - name: Install dependencies
        working-directory: tools/editor
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies for vulnerabilities
        working-directory: tools/editor
        run: npm audit --audit-level=high

      - name: TypeScript type-check
        working-directory: tools/editor
        run: npm run type-check

      - name: Run tests with coverage
        working-directory: tools/editor
        run: npm run test:coverage

      - name: Upload Editor Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-coverage-reports
          path: tools/editor/coverage/
          if-no-files-found: ignore

      - name: Build Editor
        working-directory: tools/editor
        run: npm run build

  docs-check:
    name: Documentation (VitePress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        working-directory: docs
        run: npm audit --audit-level=high

      - name: Build Web Editor Playground
        working-directory: tools/editor
        run: |
          npm ci --legacy-peer-deps
          npm run build:renderer
          mkdir -p ../../docs/public/playground
          cp -r dist/renderer/* ../../docs/public/playground/

      - name: Build VitePress docs
        working-directory: docs
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: docs
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Mobile & Layout Tests
        working-directory: docs
        run: npm test
