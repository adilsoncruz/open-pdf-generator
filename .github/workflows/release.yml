name: Monorepo Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_engine:
        description: 'Release Core Engine'
        type: boolean
        default: false
      release_cli:
        description: 'Release CLI'
        type: boolean
        default: false
      release_editor:
        description: 'Release Editor'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================
  # Detect changes by folder
  # =========================
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      cli: ${{ steps.filter.outputs.cli }}
      editor: ${{ steps.filter.outputs.editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Compare against the previous commit on the same branch
          base: ${{ github.event.before }}
          filters: |
            engine:
              - 'core/**'
            cli:
              - 'tools/cli/**'
            editor:
              - 'tools/editor/**'

  # =========================
  # Release: LIB (Gradle)
  # =========================
  release-engine:
    name: Release Engine
    needs: changes
    if: needs.changes.outputs.engine == 'true' || inputs.release_engine == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: core
        run: ./gradlew build -x test

      - name: Read version
        id: version
        working-directory: core
        run: |
          VERSION=$(./gradlew -q printVersion | tr -d '[:space:]')
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip SNAPSHOT versions
        id: snapshot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ -z "$VERSION" ]]; then
            echo "Skipping: SNAPSHOT or empty version"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Will create release"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.snapshot.outputs.skip == 'false'
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: engine-v${{ steps.version.outputs.version }}
          name: Open PDF Generator Core v${{ steps.version.outputs.version }}
          body: |
            ## Open PDF Generator - Core Library
            
            Kotlin/Java library for generating PDFs from JSON templates.
            
            ### Installation
            
            ```kotlin
            // Gradle (Kotlin DSL)
            implementation("io.github.adilsoncruz:open-pdf-generator:${{ steps.version.outputs.version }}")
            ```
          generate_release_notes: true

      - name: Publish to Maven Central Portal
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        working-directory: core
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal

  # =========================
  # Release: CLI (Gradle)
  # =========================
  release-cli:
    name: Release CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true' || inputs.release_cli == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.snapshot.outputs.skip }}
      exists: ${{ steps.tagcheck.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Core (dependency)
        working-directory: core
        run: ./gradlew build -x test

      - name: Build CLI
        working-directory: tools/cli
        run: ./gradlew shadowJar

      - name: Read version
        id: version
        working-directory: tools/cli
        run: |
          VERSION=$(./gradlew -q printVersion | tr -d '[:space:]')
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip SNAPSHOT versions
        id: snapshot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ -z "$VERSION" ]]; then
            echo "Skipping: SNAPSHOT or empty version"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Will create release"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.snapshot.outputs.skip == 'false'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Upload CLI JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-jar
          path: tools/cli/build/libs/*.jar

  # =======================================================
  # Build Native CLI Binaries (Linux, macOS, Windows)
  # =======================================================
  build-native-cli:
    name: Build Native CLI (${{ matrix.target }})
    needs: [changes]
    if: needs.changes.outputs.cli == 'true' || inputs.release_cli == true || needs.changes.outputs.editor == 'true' || inputs.release_editor == true
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            bin_name: pdf-generator
            output_name: pdf-generator-linux-amd64
            use_docker: true
          - os: macos-latest
            target: darwin-arm64
            bin_name: pdf-generator
            output_name: pdf-generator-darwin-arm64
            use_docker: false
          - os: windows-latest
            target: windows-amd64
            bin_name: pdf-generator.exe
            output_name: pdf-generator-windows-amd64.exe
            use_docker: false

    steps:
      - uses: actions/checkout@v4

      - name: Build via Docker (Linux x86_64)
        if: matrix.use_docker == true
        shell: bash
        run: |
          docker build -f tools/cli/Dockerfile.native -t open-pdf-generator:native .
          CONTAINER_ID=$(docker create open-pdf-generator:native)
          mkdir -p dist
          docker cp "$CONTAINER_ID":/usr/local/bin/pdf-generator dist/${{ matrix.output_name }}
          docker rm -v "$CONTAINER_ID"
          chmod +x dist/${{ matrix.output_name }}

      - name: Setup GraalVM (macOS / Windows)
        if: matrix.use_docker == false
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Core and CLI Fat JAR
        if: matrix.use_docker == false
        shell: bash
        run: |
          ./core/gradlew -p core jar -q
          ./tools/cli/gradlew -p tools/cli shadowJar -q

      - name: Compile Native Image (macOS / Windows)
        if: matrix.use_docker == false
        shell: bash
        run: |
          mkdir -p meta dist
          JAR_PATH=$(ls tools/cli/build/libs/pdf-generator-cli-*.jar | head -n 1)
          sh tools/cli/native-image/generate-reflect-config.sh "$JAR_PATH" meta
          java -agentlib:native-image-agent=config-merge-dir=meta -jar "$JAR_PATH" \
            generate tools/cli/native-image/train/invoice.json -d tools/cli/native-image/train/data_invoice.json -o out1.pdf
          java -agentlib:native-image-agent=config-merge-dir=meta -jar "$JAR_PATH" \
            generate tools/cli/native-image/train/listing.json -d tools/cli/native-image/train/data_listing.json -o out2.pdf
          java -agentlib:native-image-agent=config-merge-dir=meta -jar "$JAR_PATH" \
            generate tools/cli/native-image/train/complex.json -d tools/cli/native-image/train/data_complex.json -o out3.pdf

          if command -v cygpath >/dev/null 2>&1; then
            [ -n "$JAVA_HOME" ] && export PATH="$(cygpath -u "$JAVA_HOME")/bin:$PATH"
            [ -n "$GRAALVM_HOME" ] && export PATH="$(cygpath -u "$GRAALVM_HOME")/bin:$PATH"
          else
            [ -n "$JAVA_HOME" ] && export PATH="$JAVA_HOME/bin:$PATH"
            [ -n "$GRAALVM_HOME" ] && export PATH="$GRAALVM_HOME/bin:$PATH"
          fi

          NATIVE_IMAGE_CMD="native-image"
          if command -v native-image.cmd >/dev/null 2>&1; then
            NATIVE_IMAGE_CMD="native-image.cmd"
          elif command -v native-image >/dev/null 2>&1; then
            NATIVE_IMAGE_CMD="native-image"
          elif [ -n "$GRAALVM_HOME" ] && [ -f "$GRAALVM_HOME/bin/native-image.cmd" ]; then
            NATIVE_IMAGE_CMD="$GRAALVM_HOME/bin/native-image.cmd"
          elif [ -n "$JAVA_HOME" ] && [ -f "$JAVA_HOME/bin/native-image.cmd" ]; then
            NATIVE_IMAGE_CMD="$JAVA_HOME/bin/native-image.cmd"
          fi
          echo "Using native image command: $NATIVE_IMAGE_CMD"

          "$NATIVE_IMAGE_CMD" \
            --no-fallback \
            -march=compatibility \
            -Djava.awt.headless=true \
            -jar "$JAR_PATH" \
            -o dist/${{ matrix.output_name }} \
            -H:ConfigurationFileDirectories=meta \
            -H:+ReportExceptionStackTraces \
            --initialize-at-run-time=org.slf4j.LoggerFactory,org.slf4j.helpers.Reporter,ch.qos.logback \
            --initialize-at-build-time=java.awt.Color,java.awt.Toolkit,java.awt.image,java.awt.color,java.awt.Insets \
            -H:IncludeResources='logback.xml'

      - name: Generate Checksum
        shell: bash
        working-directory: dist
        run: |
          if [ ! -f "${{ matrix.output_name }}" ] && [ -f "${{ matrix.output_name }}.exe" ]; then
            mv "${{ matrix.output_name }}.exe" "${{ matrix.output_name }}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.output_name }} > ${{ matrix.output_name }}.sha256
          else
            shasum -a 256 ${{ matrix.output_name }} > ${{ matrix.output_name }}.sha256
          fi

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # =======================================================
  # Publish CLI GitHub Release with all platform binaries
  # =======================================================
  publish-cli-release:
    name: Publish CLI Release
    needs: [release-cli, build-native-cli]
    if: needs.release-cli.outputs.skip == 'false' && needs.release-cli.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-cli-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release-files
          find all-cli-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ needs.release-cli.outputs.version }}
          name: Open PDF Generator CLI v${{ needs.release-cli.outputs.version }}
          body: |
            ## Open PDF Generator - Command Line Interface

            CLI tool for generating PDFs from JSON templates.

            ### Standalone Native Binaries (No Java required)

            - **Linux (x86_64)**: `pdf-generator-linux-amd64`
            - **macOS (Apple Silicon)**: `pdf-generator-darwin-arm64`
            - **Windows (x86_64)**: `pdf-generator-windows-amd64.exe`

            ```bash
            # Linux example
            curl -L https://github.com/adilsoncruz/open-pdf-generator/releases/download/cli-v${{ needs.release-cli.outputs.version }}/pdf-generator-linux-amd64 -o pdf-generator
            chmod +x pdf-generator
            ./pdf-generator generate template.json -d data.json -o output.pdf
            ```

            ### Java Standalone JAR (Any OS with Java 17+)

            ```bash
            java -jar pdf-generator-cli-${{ needs.release-cli.outputs.version }}.jar generate template.json -d data.json -o output.pdf
            ```
          files: release-files/*

  # =========================
  # Build: Electron App (Matrix)
  # =========================
  build-editor:
    name: Build Editor (${{ matrix.os }})
    needs: [changes, build-native-cli]
    if: "!cancelled() && (needs.changes.outputs.editor == 'true' || inputs.release_editor == true)"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Download native CLI artifacts if built
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cli-native-*
          path: native-binaries

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/editor/package-lock.json

      - name: Install dependencies
        working-directory: tools/editor
        shell: bash
        run: |
          npm install
          echo "Installed vite version:"
          node node_modules/vite/bin/vite.js --version || echo "vite not found"

      - name: Setup native CLI binary in editor resources
        shell: bash
        run: |
          mkdir -p tools/editor/resources/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="pdf-generator.exe"
            TARGET="windows-amd64"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            BIN_NAME="pdf-generator"
            TARGET="darwin-arm64"
          else
            BIN_NAME="pdf-generator"
            TARGET="linux-amd64"
          fi

          ARTIFACT_FILE=$(find native-binaries -type f ! -name "*.sha256" -name "*$TARGET*" 2>/dev/null | head -n 1)
          if [ -n "$ARTIFACT_FILE" ] && [ -f "$ARTIFACT_FILE" ]; then
            echo "Using native binary from build-native-cli: $ARTIFACT_FILE"
            cp "$ARTIFACT_FILE" "tools/editor/resources/bin/$BIN_NAME"
            ARTIFACT_DIR=$(dirname "$ARTIFACT_FILE")
            cp "$ARTIFACT_DIR"/*.dll tools/editor/resources/bin/ 2>/dev/null || true
          else
            DOWNLOAD_TARGET="$TARGET"
            [ "$TARGET" = "windows-amd64" ] && DOWNLOAD_TARGET="windows-amd64.exe"
            echo "Downloading released native binary for $TARGET..."
            curl -fsSL "https://github.com/adilsoncruz/open-pdf-generator/releases/latest/download/pdf-generator-$DOWNLOAD_TARGET" \
              -o "tools/editor/resources/bin/$BIN_NAME" || echo "Warning: Could not download native binary"
          fi
          chmod +x "tools/editor/resources/bin/$BIN_NAME" 2>/dev/null || true
          ls -la tools/editor/resources/bin/
          if [ ! -s "tools/editor/resources/bin/$BIN_NAME" ]; then
            echo "ERROR: Native binary tools/editor/resources/bin/$BIN_NAME was not found or is empty!"
            exit 1
          fi

      - name: Build Electron app
        working-directory: tools/editor
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js build
          node node_modules/typescript/bin/tsc -p tsconfig.main.json

      - name: Package Electron app
        working-directory: tools/editor
        shell: bash
        run: node node_modules/electron-builder/out/cli/cli.js --publish never

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: editor-dist-${{ matrix.os }}
          path: |
            tools/editor/release/*.dmg
            tools/editor/release/*.exe
            tools/editor/release/*.AppImage
            tools/editor/release/*.deb
            tools/editor/release/*.zip
            tools/editor/release/*.yml
            tools/editor/release/*.blockmap
          if-no-files-found: error

  # =========================
  # Release: Electron App
  # =========================
  release-editor:
    name: Publish Editor Release
    needs: [changes, build-editor]
    if: needs.changes.outputs.editor == 'true' || inputs.release_editor == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download all editor artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: editor-dist-*
          path: release-artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: tools/editor
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: releasetype
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"

          if [[ -z "$VERSION" ]]; then
            echo "Empty version, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-dev"* ]] || [[ "$VERSION" == *"-alpha"* ]]; then
            echo "Dev/Alpha version, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "Beta/RC version, creating prerelease"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Stable version, creating release"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.releasetype.outputs.skip == 'false'
        shell: bash
        run: |
          TAG="editor-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.releasetype.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="editor-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create / Update GitHub Release
        if: steps.releasetype.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: editor-v${{ steps.version.outputs.version }}
          name: PDF Template Editor v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.releasetype.outputs.prerelease == 'true' }}
          body: |
            ## PDF Template Editor
            
            Visual desktop editor for creating PDF templates.
            
            ### Downloads
            
            - **macOS**: `.dmg` (Universal) or `.zip`
            - **Windows**: `.exe` installer (NSIS) or `.zip` (x64)
            - **Linux**: `.AppImage` or `.deb` (x64)
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.zip