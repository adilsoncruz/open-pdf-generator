name: Monorepo Releases

on:
  push:
    branches:
      - main
      - bootstrap
  workflow_dispatch:
    inputs:
      release_engine:
        description: 'Release Core Engine'
        type: boolean
        default: false
      release_cli:
        description: 'Release CLI'
        type: boolean
        default: false
      release_editor:
        description: 'Release Editor'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================
  # Detect changes by folder
  # =========================
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      cli: ${{ steps.filter.outputs.cli }}
      editor: ${{ steps.filter.outputs.editor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Compare against the previous commit on the same branch
          base: ${{ github.event.before }}
          filters: |
            engine:
              - 'core/**'
            cli:
              - 'tools/cli/**'
            editor:
              - 'tools/editor/**'

  # =========================
  # Release: LIB (Gradle)
  # =========================
  release-engine:
    name: Release Engine
    needs: changes
    if: needs.changes.outputs.engine == 'true' || inputs.release_engine == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: core
        run: ./gradlew build -x test

      - name: Read version
        id: version
        working-directory: core
        run: |
          VERSION=$(./gradlew -q printVersion | tr -d '[:space:]')
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip SNAPSHOT versions
        id: snapshot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ -z "$VERSION" ]]; then
            echo "Skipping: SNAPSHOT or empty version"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Will create release"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.snapshot.outputs.skip == 'false'
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: engine-v${{ steps.version.outputs.version }}
          name: Open PDF Generator Core v${{ steps.version.outputs.version }}
          body: |
            ## Open PDF Generator - Core Library
            
            Kotlin/Java library for generating PDFs from JSON templates.
            
            ### Installation
            
            ```kotlin
            // Gradle (Kotlin DSL)
            implementation("com.github.adilsoncruz:open-pdf-generator:${{ steps.version.outputs.version }}")
            ```
          generate_release_notes: true

  # =========================
  # Release: CLI (Gradle)
  # =========================
  release-cli:
    name: Release CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true' || inputs.release_cli == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Core (dependency)
        working-directory: core
        run: ./gradlew build -x test

      - name: Build CLI
        working-directory: tools/cli
        run: ./gradlew shadowJar

      - name: Read version
        id: version
        working-directory: tools/cli
        run: |
          VERSION=$(./gradlew -q printVersion | tr -d '[:space:]')
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip SNAPSHOT versions
        id: snapshot
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ -z "$VERSION" ]]; then
            echo "Skipping: SNAPSHOT or empty version"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Will create release"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.snapshot.outputs.skip == 'false'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.snapshot.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          name: Open PDF Generator CLI v${{ steps.version.outputs.version }}
          body: |
            ## Open PDF Generator - Command Line Interface
            
            CLI tool for generating PDFs from JSON templates.
            
            ### Usage
            
            ```bash
            java -jar pdf-generator-cli-${{ steps.version.outputs.version }}.jar generate template.json -d data.json -o output.pdf
            ```
          files: tools/cli/build/libs/*.jar

  # =========================
  # Build: Electron App (Matrix)
  # =========================
  build-editor:
    name: Build Editor (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.editor == 'true' || inputs.release_editor == true
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/editor/package-lock.json

      - name: Install dependencies
        working-directory: tools/editor
        shell: bash
        run: |
          npm install
          echo "Installed vite version:"
          node node_modules/vite/bin/vite.js --version || echo "vite not found"

      - name: Build Electron app
        working-directory: tools/editor
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js build
          node node_modules/typescript/bin/tsc -p tsconfig.main.json

      - name: Package Electron app
        working-directory: tools/editor
        shell: bash
        run: node node_modules/electron-builder/out/cli/cli.js --publish never

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: editor-dist-${{ matrix.os }}
          path: |
            tools/editor/release/*.dmg
            tools/editor/release/*.exe
            tools/editor/release/*.AppImage
            tools/editor/release/*.deb
            tools/editor/release/*.zip
          if-no-files-found: error

  # =========================
  # Release: Electron App
  # =========================
  release-editor:
    name: Publish Editor Release
    needs: [changes, build-editor]
    if: needs.changes.outputs.editor == 'true' || inputs.release_editor == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download all editor artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: editor-dist-*
          path: release-artifacts
          merge-multiple: true

      - name: Read version
        id: version
        working-directory: tools/editor
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: releasetype
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking version: $VERSION"

          if [[ -z "$VERSION" ]]; then
            echo "Empty version, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-dev"* ]] || [[ "$VERSION" == *"-alpha"* ]]; then
            echo "Dev/Alpha version, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "Beta/RC version, creating prerelease"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Stable version, creating release"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag exists
        id: tagcheck
        if: steps.releasetype.outputs.skip == 'false'
        shell: bash
        run: |
          TAG="editor-v${{ steps.version.outputs.version }}"
          echo "Checking tag: $TAG"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.releasetype.outputs.skip == 'false' && steps.tagcheck.outputs.exists == 'false'
        run: |
          TAG="editor-v${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create / Update GitHub Release
        if: steps.releasetype.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: editor-v${{ steps.version.outputs.version }}
          name: PDF Template Editor v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.releasetype.outputs.prerelease == 'true' }}
          body: |
            ## PDF Template Editor
            
            Visual desktop editor for creating PDF templates.
            
            ### Downloads
            
            - **macOS**: `.dmg` (Universal) or `.zip`
            - **Windows**: `.exe` installer (NSIS) or `.zip` (x64)
            - **Linux**: `.AppImage` or `.deb` (x64)
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.zip